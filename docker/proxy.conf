# Caddy terminates TLS, so PHP would otherwise see plain HTTP and Joomla would
# emit http:// URLs and break admin redirects. Trusting the proxy header here
# fixes it for core and every extension at once, with no Joomla config.
# Trusting this header unconditionally is safe here only because the joomla
# service publishes no ports — Caddy is the only thing that can reach it.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

ServerName joomla.test
