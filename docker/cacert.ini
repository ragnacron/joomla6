; The CA bundle PHP trusts for outbound TLS, so code in here can reach another *.test stack over HTTPS.
;
; An ini setting rather than the SSL_CERT_FILE environment variable, because Composer\CaBundle — which
; is what Joomla's framework HTTP transports ask for the system bundle — only reads that variable from
; $_SERVER outside the CLI SAPI, and Apache does not put the container's environment there. ini_get() is
; the next thing it consults and it behaves the same in both SAPIs.
;
; curl.cainfo covers anything calling curl directly and letting it pick its own default.
openssl.cafile=/etc/ssl/certs/cacert-mkcert.pem
curl.cainfo=/etc/ssl/certs/cacert-mkcert.pem
