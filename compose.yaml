services:
  caddy:
    image: caddy:2-alpine
    # Loopback only. The admin password is a published default in .env.example,
    # so binding 0.0.0.0 would hand the admin panel to everyone on the wifi.
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - joomla
      - mailpit

  joomla:
    build:
      context: ./docker
      dockerfile: joomla.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_NAME: ${DB_NAME}
      JOOMLA_DB_USER: ${DB_USER}
      JOOMLA_DB_PASSWORD: ${DB_PASSWORD}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
      JOOMLA_SMTP_HOST: mailpit
      JOOMLA_SMTP_HOST_PORT: 1025
    volumes:
      - joomla_data:/var/www/html
      - ./src:/src:ro
    # Linux has no native host.docker.internal; harmless on macOS/Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    # Pinned to match production exactly. Bumping this is a downgrade/upgrade of
    # the data files, so it needs `make destroy` first, not just `make up`.
    image: mariadb:10.5.29
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit

volumes:
  db_data:
  joomla_data:
